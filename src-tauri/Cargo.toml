[package]
name = "lumen-desktop"
version = "1.0.0"
description = "Lumen — Artisanal Desktop Spatial Companion & Workspace"
authors = ["Lumen Desktop Engineering Team"]
edition = "2021"

[lib]
name = "lumen_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
